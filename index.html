<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application Form</title>
</head>
<body>

    <h2>Job Application Form</h2>

    <form action="#" method="POST">

        <fieldset>
            <legend>1. Personal Information</legend>
            
            <p>
                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full_name" placeholder="Enter your full name" required>
            </p>

            <p>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </p>

            <p>
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" name="phone" placeholder="Enter phone number" required>
            </p>

            <p>
                <label for="portfolio">Website or Portfolio:</label>
                <input type="url" id="portfolio" name="portfolio" placeholder="https://..." required>
            </p>

            <p>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>2. Job Details</legend>

            <p>
                <label for="position">Job Position:</label>
                <select id="position" name="position" required>
                    <option value="">-- Select --</option>
                    <option value="frontend">Frontend Developer</option>
                    <option value="backend">Backend Developer</option>
                    <option value="uiux">UI/UX Designer</option>
                    <option value="qa">QA Engineer</option>
                </select>
            </p>

            <p>
                <label>Preferred Work Location:</label><br>
                <input type="radio" id="onsite" name="location" value="onsite" required>
                <label for="onsite">On-site</label><br>
                
                <input type="radio" id="remote" name="location" value="remote">
                <label for="remote">Remote</label><br>
                
                <input type="radio" id="hybrid" name="location" value="hybrid">
                <label for="hybrid">Hybrid</label>
            </p>

            <p>
                <label>Skills:</label><br>
                <input type="checkbox" id="html" name="skills" value="html">
                <label for="html">HTML</label><br>

                <input type="checkbox" id="css" name="skills" value="css">
                <label for="css">CSS</label><br>

                <input type="checkbox" id="js" name="skills" value="javascript">
                <label for="js">JavaScript</label><br>

                <input type="checkbox" id="react" name="skills" value="react">
                <label for="react">React</label><br>

                <input type="checkbox" id="node" name="skills" value="node">
                <label for="node">Node.js</label>
            </p>

            <p>
                <label for="resume">Resume Upload:</label>
                <input type="file" id="resume" name="resume" required>
            </p>

            <p>
                <label for="about">Write About Yourself:</label><br>
                <textarea id="about" name="about" rows="4" cols="50" required></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>3. Extra Section</legend>

            <p>
                <label for="tech-stack">Search your favorite tech stack:</label>
                <input type="search" id="tech-stack" name="tech_stack">
            </p>

            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </p>

            <p>
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm_password" required>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Submit Application">
        </p>

    </form>

</body>
</html>
